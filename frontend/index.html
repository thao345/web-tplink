<!-- đây là html login -->
<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Nhập | 广部管理系统</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="static/css/login.css" />
  </head>
  <body>
    <!-- Background layers -->
    <div class="bg-layer"></div>
    <div class="grid-lines"></div>

    <!-- Login Card --> 
    <div class="login-card">
      <div class="brand">
        <div class="brand-icon">
          <i class="fas fa-industry"></i>
        </div>
        <div class="brand-title">广部管理系统</div>
        <div class="brand-sub">Hệ Thống Quản Lý Nhà Máy</div>
      </div>

      <div class="divider"><span>ĐĂNG NHẬP HỆ THỐNG</span></div>

      <!-- Form -->
      <div class="form-group">
        <label class="form-label">Tên tài khoản</label>
        <div class="input-wrap">
          <i class="fas fa-user input-icon"></i>
          <input
            class="form-control"
            id="username"
            type="text"
            placeholder="Nhập tên đăng nhập..."
            autocomplete="username"
            autofocus
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Mật khẩu</label>
        <div class="input-wrap">
          <i class="fas fa-lock input-icon"></i>
          <input
            class="form-control"
            id="password"
            type="password"
            placeholder="Nhập mật khẩu..."
            autocomplete="current-password"
          />
          <button
            class="eye-btn"
            id="eyeBtn"
            type="button"
            onclick="toggleEye()"
            tabindex="-1"
          >
            <i class="fas fa-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <div class="remember-row">
        <input type="checkbox" id="rememberMe" />
        <label for="rememberMe">Ghi nhớ đăng nhập</label>
      </div>

      <button class="btn-login" id="loginBtn" onclick="doLogin()">
        <span class="spinner" id="spinner"></span>
        <i class="fas fa-sign-in-alt" id="loginIcon"></i>
        <span id="loginText">Đăng Nhập</span>
      </button>

      <div class="alert alert-error" id="alertError">
        <i class="fas fa-exclamation-circle"></i>
        <span id="errorMsg">Tên đăng nhập hoặc mật khẩu không đúng.</span>
      </div>

      <div class="alert alert-success" id="alertSuccess">
        <i class="fas fa-check-circle"></i>
        <span>Đăng nhập thành công! Đang chuyển trang...</span>
      </div>

      <div class="card-footer">© 2025 广部管理系统 · All rights reserved</div>
    </div>

    <!-- auth login -->
    <script src="static/js/auth.js"></script>
  </body>
</html>
